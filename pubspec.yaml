version: 0.5.1+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqlite3: ^3.7.1
  sqlite3_flutter_libs: ^0.6.0+eol
